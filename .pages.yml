media:
  input: src/assets/images
  output: src/assets/images

# .pages.yml — Pages CMS config cho Astro blog (src/content/blogs)

# (Tuỳ chọn) Cấu hình nơi lưu media khi upload từ CMS.
# Với schema dùng image() của Astro, nên đặt ảnh TRONG thư mục 'src'
# để có thể import tương đối từ bài viết.

# .pages.yml — Astro blog (src/content/blogs)

media:
  input: src/content/blogs/_images
  output: /images

content:
  - name: blogs
    label: Blogs
    type: collection
    path: "src/content/blogs"
    filename: "{year}-{month}-{day}-{fields.title}.md"  # đổi .mdx nếu bạn dùng MDX
    view:
      fields: [title, draft, pubDate, author, tags]
      default:
        sort: pubDate
        order: desc

    fields:
      - name: title
        label: Title
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: pubDate
        label: Publication Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
          time: false

      - name: author
        label: Author
        type: string
        required: false

      - name: tags
        label: Tags
        type: list
        required: false
        

      - name: draft
        label: Draft
        type: boolean
        default: false

      - name: image
        label: Cover Image
        type: object
        required: false
        fields:
          - name: url
            label: Image file
            type: image
            path: "src/content/blogs/_images"
            required: true
            extensions: [jpg, jpeg, png, webp, gif, svg]
          - name: alt
            label: Alt text
            type: string
            required: false
      - name: body
        label: Body
        type: rich-text
        required: false