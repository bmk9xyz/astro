# .pages.yml (phần quan trọng)
media:
  - name: astro_images
    input: src/content/blogs/_images
    output: /images
  - name: public_images
    input: public/images
    output: /images
  - name: public_videos
    input: public/videos
    output: /videos

content:
  - name: blogs
    label: Blogs
    type: collection
    path: src/content/blogs
    filename: "{year}-{month}-{day}-{fields.title}.md"
    view:
      fields: [title, draft, pubDate, author, tags]
      default: { sort: pubDate, order: desc }

    fields:
      # …(các meta fields: title, description, pubDate, author, tags, draft, image{url,alt})…

      # BODY = danh sách khối (Text / Video)
      - name: body
        label: Body
        type: block
        list: true
        blocks:
          - name: text
            label: Text
            fields:
              - name: content
                label: Content
                type: rich-text
                options:
                  media: public_images   # cho phép chèn ảnh vào text
          - name: video
            label: Video
            fields:
              - name: source
                label: Source
                type: select
                options:
                  values: [youtube, vimeo, file]
              - name: url
                label: Video URL (YouTube/Vimeo)
                type: string
                required: false
              - name: file
                label: Upload video file
                type: file
                required: false
                options:
                  media: public_videos
                  categories: [video]    # chỉ nhận mp4/mov/… theo danh mục video
              - name: caption
                label: Caption
                type: string
